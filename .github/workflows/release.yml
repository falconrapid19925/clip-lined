name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            exe: clip-line-app.exe
            asset: clip-line-windows-x64.zip
          - os: ubuntu-latest
            exe: clip-line-app
            asset: clip-line-linux-x64.tar.gz
          - os: macos-latest
            exe: clip-line-app
            asset: clip-line-macos-universal.tar.gz
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/cache@v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-rel-${{ matrix.os }}-${{ hashFiles('**/Cargo.toml') }}
      - run: cargo build --release -p clip-line-app
      - name: Package (unix)
        if: runner.os != 'Windows'
        run: |
          mkdir pkg
cp target/release/clip-line-app pkg/
cp target/release/clip-line-headless pkg/
          tar -czf "${{ matrix.asset }}" -C pkg .
      - name: Package (windows)
        if: runner.os == 'Windows'
        run: |
          mkdir pkg
cp target/release/clip-line-app.exe pkg/
cp target/release/clip-line-headless.exe pkg/
          Compress-Archive -Path pkg/* -DestinationPath "${{ matrix.asset }}"
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/download-artifact@v8.0.2
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" clip-line-*/*.zip clip-line-*/*.tar.gz \
            --title "clipLine $TAG" \
            --generate-notes
