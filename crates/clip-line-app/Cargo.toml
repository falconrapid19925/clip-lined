[package]
name = "clip-line-app"
description = "clipLine desktop application (egui)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
default-run = "clip-line-app"

[[bin]]
name = "clip-line-app"
path = "src/main.rs"

[[bin]]
name = "clip-line-headless"
path = "src/bin/headless.rs"

[features]
default = []
encryption = ["clip-line-core/encryption", "dep:rpassword"]

[dependencies]
clip-line-core = { path = "../clip-line-core" }
anyhow.workspace = true
eframe = "0.37"
egui_extras = { version = "0.37", features = ["serde"] }
serde.workspace = true
toml.workspace = true
global-hotkey = "0.9"
ureq = { version = "2.12", features = ["json"] }
semver = "1"
rust-i18n = "3"
rpassword = { version = "7", optional = true }

[target.'cfg(windows)'.dependencies]
clip-line-win = { path = "../clip-line-win" }
tray-icon = "0.26"
windows = { version = "0.62", features = [
    "Win32_System_Registry",
    "Win32_Foundation",
] }

[dev-dependencies]
tempfile = "3"

[target.'cfg(target_os = "linux")'.dependencies]
clip-line-x11 = { path = "../clip-line-x11" }
clip-line-wayland = { path = "../clip-line-wayland" }
tray-icon = { version = "0.26", default-features = false, features = ["ksni"] }

[target.'cfg(target_os = "macos")'.dependencies]
clip-line-macos = { path = "../clip-line-macos" }
tray-icon = { version = "0.26", default-features = false }
