[package]
name = "clip-line-x11"
description = "X11 adapters for clipLine"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
clip-line-core = { path = "../clip-line-core" }
anyhow.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
arboard = { version = "3.7", default-features = false, features = ["image-data"] }
x11rb = { version = "0.13", features = ["xfixes", "xtest"] }
clip-line-linux-common = { path = "../clip-line-linux-common" }
